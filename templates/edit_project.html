{% extends "base.html" %}

{% block title %}
    Edit Project
{% endblock %}

{% block content %}
<form class="project-form" method="POST" action="{{ url_for('edit_project_page', project_id=project[0]) }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ project[1] }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" cols="50" 
    placeholder="Write your Description here...">{{ project[2] }}</textarea>

    <label for="status">Status</label>
    <select id="status" name="status" required>
        <option value="" disabled>-- Select Status --</option>

        <option value="Not Started"
            {% if project[3] == "Not Started" %}selected{% endif %}>
            Not Started
        </option>

        <option value="In Progress">
            In Progress
        </option>

        <option value="Completed">
            Completed
        </option>

        <option value="On Hold">
            On Hold
        </option>

        <option value="Cancelled">
            Cancelled
        </option>
    </select>

    <label for="priority">Priority</label>
    <select id="priority" name="priority" required>
        <option value="" disabled>-- Select Priority --</option>

        <option value="High"
            {% if project[4] == "High" %}selected{% endif %}>
            High
        </option>

        <option value="Medium"
            {% if project[4] == "Medium" %}selected{% endif %}>
            Medium
        </option>

        <option value="Low"
            {% if project[4] == "Low" %}selected{% endif %}>
            Low
        </option>
    </select>
    
    <label for="deadline">Deadline</label>
    <input type="date" id="deadline" name="deadline" value="{{ project[5] }}">

    <button class="confirm-button" type="submit">Edit Confirmation</button>

</form>
{% endblock %}
